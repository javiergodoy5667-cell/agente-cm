<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Cuenta autorizada</title>
<style>
body{font-family:system-ui,sans-serif;max-width:680px;margin:0 auto;padding:32px 16px;line-height:1.6;color:#1a1a1a;background:#fff}
code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:6px}
button{margin-top:12px;padding:10px 16px;font-size:1rem}
</style>
</head>
<body>
<h1 id="titulo">Autorización recibida</h1>
<p id="ayuda">Vuelve al chat del agente. No compartas esta página.</p>
<code id="orden" hidden></code>
<button id="copiar" hidden>Copiar</button>
<script>
const datos = new URLSearchParams(location.search);
const codigo = datos.get("code");
const orden = document.getElementById("orden");
const copiar = document.getElementById("copiar");
if (codigo) {
  orden.textContent = "/codigo " + encodeURIComponent(codigo);
  orden.hidden = false;
  copiar.hidden = false;
  document.getElementById("ayuda").textContent = "Copia este texto y pégalo en el chat de tu agente. Vence en pocos minutos y no se lo pases a nadie más.";
  copiar.onclick = () => navigator.clipboard.writeText(orden.textContent).then(() => { copiar.textContent = "Copiado"; });
} else if (datos.get("error")) {
  document.getElementById("titulo").textContent = "No se autorizó";
  document.getElementById("ayuda").textContent = "Vuelve al chat del agente y pide el enlace otra vez.";
}
</script>
</body>
</html>
